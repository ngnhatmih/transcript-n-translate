[pytest]
testpaths = tests
pythonpath = .
# ĐÚNG MỘT `-q`. Thêm một `-q` nữa thành `-qq` và pytest NUỐT dòng "N passed" —
# tức là báo cáo mất đúng con số nó tồn tại để đưa ra.
#
# `-m "not live"` giữ mấy bài chạm model thật (tests/test_mt_live.py) khỏi lần
# chạy mặc định: máy chưa cài weight không được đỏ vì lý do không liên quan tới
# code. Chạy chúng bằng `python -B -m pytest -m live`.
addopts = -q -m "not live"
markers =
    live: chạm model thật; mặc định bỏ qua (dùng -m live để chạy)
