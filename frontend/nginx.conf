# Bản tĩnh + proxy `/api` sang service `api` (tên service trong docker-compose.yml).
#
# Proxy phải tắt buffering cho `/api/` vì `/api/jobs/stream` là SSE: để nginx đệm thì
# trình duyệt không nhận sự kiện theo thời gian thực, thanh tiến trình đứng im.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── TRẦN KÍCH THƯỚC TỆP TẢI LÊN: mặc định của nginx là **1 MB** ────────────────────────
    # Đo được (lượt dùng thật): tải `BV1BfBFB4Ebh_audio.mp3` qua cổng web ⇒ `413: Request
    # Entity Too Large`, và câu đó KHÔNG tới từ backend — nó là `statusText` của nginx
    # (`client.ts` chỉ rơi về `statusText` khi body KHÔNG phải JSON ⇒ body là trang HTML
    # của nginx). Ngay cả tệp thử trong repo (`8f4b5304daf42569.wav`, 8,5 MB) cũng vượt
    # 1 MB, nên MỌI tệp thật đều bị chặn ở đây trong khi backend nhận đủ.
    # 2048 MB là trần của một bản ghi vài giờ audio; đây là ỨNG DỤNG CỤC BỘ nên trần thật
    # là ĐĨA, không phải băng thông.
    client_max_body_size 2048m;

    # Khi vượt trần: trả JSON ĐÚNG KHUÔN FastAPI (`{"detail": …}`) để `ApiError.detail` là
    # một câu TIẾNG VIỆT nói phải làm gì. Không có khối này thì người dùng đọc một câu
    # tiếng Anh của nginx ("Request Entity Too Large") — đúng thứ chính các màn đã cấm:
    # lỗi không được nói bằng câu chung, và không được bỏ mất hành động cần làm.
    error_page 413 = @qua_lon;
    location @qua_lon {
        internal;
        default_type application/json;
        return 413 '{"detail":"tệp quá lớn — máy chủ nhận tối đa 2048 MB (client_max_body_size trong frontend/nginx.conf)"}';
    }

    location /api/ {
        proxy_pass http://api:8620;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ── BẢN TĨNH KHÔNG CÓ HASH NỘI DUNG ⇒ PHẢI BẮT KIỂM LẠI ─────────────────────────────
    # Rollup xuất tên CỐ ĐỊNH (`index.js`, `index.css`), nên URL không đổi khi ảnh được build
    # lại và trình duyệt có quyền dùng lại bản CŨ. ĐO ĐƯỢC: sau khi build lại ảnh `web` có
    # `overflow-wrap: anywhere` cho `.ch__ten` (kiểm trong ảnh: `grep anywhere` = 2), Chrome
    # vẫn đọc ra `overflow-wrap: normal` và hàng kênh còn đè chữ — tức một lượt kiểm hình
    # thức SAI, đúng lớp lỗi "bản cũ trả lời cho bản mới".
    # `no-cache` KHÔNG phải "đừng lưu": nó bắt kiểm lại `ETag`/`Last-Modified` mỗi lượt, nên
    # tệp không đổi vẫn được `304` và không tải lại.
    location /assets/ {
        add_header Cache-Control "no-cache";
    }

    # SPA không router: mọi đường không phải tệp thì trả index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
