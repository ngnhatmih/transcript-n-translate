# Bản tĩnh + proxy `/api` sang service `api` (tên service trong docker-compose.yml).
#
# Proxy phải tắt buffering cho `/api/` vì `/api/jobs/stream` là SSE: để nginx đệm thì
# trình duyệt không nhận sự kiện theo thời gian thực, thanh tiến trình đứng im.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8620;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA không router: mọi đường không phải tệp thì trả index.html.
    location / {
        try_files $uri /index.html;
    }
}
