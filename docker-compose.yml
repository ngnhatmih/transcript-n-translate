# Chạy sản phẩm bằng Docker: hai service, một lệnh.
#
#   docker compose up --build
#   → web  http://127.0.0.1:3100      (nginx phục vụ bản tĩnh, proxy /api sang api)
#   → api  http://127.0.0.1:8620      (FastAPI + ffmpeg; mặc định fw-large-v3-turbo + opus-mt)
#
# KHÔNG có GPU và KHÔNG có Ollama trong hai image này — xem README mục "Chạy bằng Docker"
# để biết cái gì chạy được và cái gì cần cài thêm trên máy chủ.
services:
  api:
    build: ./backend
    # ── CỔNG API CHỈ NGHE TRÊN LOOPBACK, KHÔNG PHẢI 0.0.0.0 ───────────────────────────────
    #
    # ĐO ĐƯỢC (bản cũ `"8620:8620"`): Docker bind vào MỌI giao diện, nên `8620` lộ ra LAN
    # và — khi mở tunnel — ra cả Internet. Backend này KHÔNG có một lớp xác thực nào:
    # không token, không session, không `TrustedHostMiddleware`, CORS chỉ là danh sách hai
    # origin dev (và CORS không phải xác thực — `curl` bỏ qua nó hoàn toàn). Nghĩa là ai
    # với tới được cổng đó thì upload tệp, xoá nguồn, duyệt bản ghi, đọc toàn bộ media.
    #
    # `127.0.0.1:8620:8620` = chỉ tiến trình TRÊN CHÍNH MÁY này kết nối được. Container
    # `web` KHÔNG bị ảnh hưởng: nó gọi `http://api:8620` qua mạng nội bộ của compose,
    # không đi qua cổng đã publish. Đó là lý do ràng buộc này an toàn mà không phá gì.
    ports:
      - "127.0.0.1:8620:8620"
    # GPU cho CẢ hai việc: OPUS-MT (torch) và faster-whisper (CTranslate2 + cuBLAS).
    # Máy KHÔNG có GPU: bỏ dòng `gpus` + `PHUDE_ASR_DEVICE` dưới đây, và đổi torch
    # trong `backend/requirements-docker.txt` sang bản `cpu` (xem README).
    gpus: all
    environment:
      # Thiết bị ASR: `cuda` khi container thấy GPU; `cpu` khi không.
      PHUDE_ASR_DEVICE: cuda
      # Ollama KHÔNG chạy trong compose: dùng Ollama của MÁY CHỦ (model 5 GB đã có,
      # và nó đang dùng GPU của máy). `host-gateway` là địa chỉ máy chủ từ container.
      OLLAMA_HOST: http://host.docker.internal:11434
      # Engine dịch `runtime: "http"` của registry trỏ `http://127.0.0.1:8790/v1` (gateway
      # `whalegate` khi chạy THẲNG trên máy). Trong container, `127.0.0.1` là CHÍNH container
      # ⇒ phép dò `available` trả false (đo được). Biến này là địa chỉ của MÁY CHỦ; nó thắng
      # `opts.base_url` trong registry (`config.resolve_openai_base_url`), cùng khuôn M-10 của
      # `OLLAMA_HOST` ở trên. Không chạy gateway ⇒ engine đó chỉ đơn giản là `available: false`.
      PHUDE_OPENAI_BASE_URL: http://host.docker.internal:8790/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # `/data`: DB + media + log + output. `/models`: cache model HF (~1,6 GB tải lần đầu).
      - phude-data:/data
      - hf-models:/models
    healthcheck:
      # `start_period` rộng: lần chạy đầu phải tải model trước khi `/api/status` trả 200.
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8620/api/status',timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  web:
    build: ./frontend
    # ── CỔNG WEB CŨNG CHỈ NGHE TRÊN LOOPBACK ─────────────────────────────────────────────
    #
    # Đây là cổng DUY NHẤT được phép ra ngoài, và nó ra ngoài qua TUNNEL, không qua bind
    # 0.0.0.0. `cloudflared` chạy trên chính máy này và trỏ `http://127.0.0.1:3100`, nên
    # nó vẫn vào được; còn máy khác trong LAN thì không vào thẳng được nữa.
    #
    # Nếu bạn CHỦ Ý muốn mở cho LAN (điện thoại cùng wifi) mà không dùng tunnel, đổi dòng
    # dưới thành `"3100:80"` — nhưng biết rằng lúc đó ai trong LAN cũng dùng được toàn bộ
    # ứng dụng, vì ứng dụng không có đăng nhập.
    ports:
      - "127.0.0.1:3100:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  phude-data:
  hf-models:
